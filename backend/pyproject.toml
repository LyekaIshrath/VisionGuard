[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "visionguard-backend"
version = "0.1.0"
description = "VisionGuard Backend - Privacy-first real-time human safety & wellness vision platform"

[project.dependencies]
fastapi = "*"
uvicorn = "*"
pydantic = "*"

[project.scripts]
run = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
test = "pytest"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore:.*starlette.testclient.*:Warning",
]
